# Model catalogue — EDIT FREELY. Prices change often; each entry carries the
# date it was last checked and the vendor page to re-check it.
# Prices below are approximate research figures (Nov 2026). Verify before
# relying on them.  `vg catalog check` lists entries older than 30 days.
#
# strengths: 1 (poor) .. 5 (best) per shot type. The router picks the best
# configured model for each shot type; fallbacks follow in score order.
# time: queue_s = typical wait before work starts; per_output_s = seconds of
# processing per second of output (or per image/request when unit != second).

